name: Starlink Tracking Refresh

on:
  schedule:
    # Daily at 05:38
    - cron: '38 5 * * *'
  workflow_dispatch:
    inputs:
      ignore:
        description: nothing
        required: false
        default: ignore

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install libwww-perl
        run: sudo apt-get update && sudo apt-get install -y libwww-perl
      - name: Get Tracking Data
        env:
          SPACE_TRACK_ID: ${{ secrets.SPACE_TRACK_ID }}
          SPACE_TRACK_PW: ${{ secrets.SPACE_TRACK_PW }}
        run: cd starlink && perl starlinkupdate.pl
      - name: Publish to data branch (single orphan commit, no history)
        run: |
          git config user.name "github-actions" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp starlink/starlink.js "$RUNNER_TEMP/starlink.js"
          git checkout --orphan data
          git rm -rf -q .
          mkdir -p starlink
          cp "$RUNNER_TEMP/starlink.js" starlink/starlink.js
          git add starlink/starlink.js
          git commit -q -m "Starlink tracking data $(date -u +%F)"
          git push --force origin data
      - name: Purge jsDelivr cache
        continue-on-error: true
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/starlink/starlink.js"
